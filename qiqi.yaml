# Пути (относительно этого файла).
db_path: prompts.sqlite

paths:
  previews_dir: previews
  fullsize_dir: fullsize
  incoming_dir: incoming
  deleted_dir: deleted
  exports_dir: exports

server:
  host: 127.0.0.1
  port: 8765

qwen:
  default_cfg: 2.5
  cfg_green: [1.0, 3.0]
  cfg_orange: [0.5, 4.0]

  # Параметры генерации превью.
  preview:
    count: 3
    steps: 20
    size: [768, 768]

  # Параметры генерации фуллсайза.
  fullsize:
    steps: 40
    size: [1280, 1280]