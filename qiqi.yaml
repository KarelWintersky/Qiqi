# Пути (относительно этого файла).
db_path: prompts.sqlite

paths:
  previews_dir: previews
  fullsize_dir: fullsize
  incoming_dir: incoming
  deleted_dir: deleted
  exports_dir: exports

server:
  host: 127.0.0.1
  port: 8765

qwen:
  default_cfg: 2.5
  cfg_green: [2.0, 3.0]
  cfg_orange: [1.5, 4.0]

  # Параметры генерации превью.
  preview:
    steps: 20
    count: 3
    sizes:
      square: [320, 320]
      wide:   [1472, 1104]
      tall:   [1104, 1472]
    default_size: square

  # Параметры генерации фуллсайза.
  fullsize:
    steps: 40
    sizes:
      square: [1280, 1280]
      wide:   [1472, 1104]
      tall:   [1104, 1472]
    default_size: square