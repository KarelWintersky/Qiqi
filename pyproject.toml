[project]
name = "qiqi"
version = "0.1.0"
description = "Локальный каталог промптов для Qwen Image"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
]

[project.scripts]
qiqi = "qiqi.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qiqi"]